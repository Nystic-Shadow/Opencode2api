version: '3.8'

services:
  gateway:
    image: ghcr.io/nystic-shadow/opencode2api:latest
    build: .
    container_name: opencode2api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT:-8080}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-admin123}
    volumes:
      - ./data:/app/data
