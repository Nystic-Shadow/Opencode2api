services:
  gateway:
    image: ghcr.io/nystic-shadow/opencode2api:latest
    build: .
    container_name: opencode2api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # .env only needs PORT, DASHBOARD_USER, and DASHBOARD_PASS.
      - PORT=${PORT:-8080}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      # Required: set DASHBOARD_PASS in .env or your shell before starting.
      - DASHBOARD_PASS=${DASHBOARD_PASS:?Set DASHBOARD_PASS to a strong password}
      # Safe, zero-config defaults: no direct fallback; proxies are discovered
      # and verified automatically. Set PROXIES to add your own routes.
      - EGRESS_MODE=proxy_only
      - ALLOW_DIRECT_FALLBACK=false
      # Optional manual overrides; empty means discovery-only.
      - PROXIES=${PROXIES:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/readyz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
