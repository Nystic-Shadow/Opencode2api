services:
  gateway:
    image: ghcr.io/nystic-shadow/opencode2api:latest
    build: .
    container_name: opencode2api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      # Required: set DASHBOARD_PASS in .env or your shell before starting.
      - DASHBOARD_PASS=${DASHBOARD_PASS:?Set DASHBOARD_PASS to a strong password}
      # Proxy-only deployment: no tunnel sidecar, no direct fallback.
      - EGRESS_MODE=proxy_only
      - ALLOW_DIRECT_FALLBACK=false
      # Required: one or more explicit HTTP/HTTPS/SOCKS5 proxies.
      - PROXIES=${PROXIES:?Set PROXIES to a comma-separated proxy list}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-30000}
      - REQUEST_DEADLINE_MS=${REQUEST_DEADLINE_MS:-90000}
      - QUEUE_MAX_CONCURRENT=${QUEUE_MAX_CONCURRENT:-8}
      - QUEUE_MAX_PER_KEY=${QUEUE_MAX_PER_KEY:-4}
      - QUEUE_MAX_SIZE=${QUEUE_MAX_SIZE:-100}
      - QUEUE_WAIT_MS=${QUEUE_WAIT_MS:-15000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
